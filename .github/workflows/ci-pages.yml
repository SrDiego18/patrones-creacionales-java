name: CI y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar, probar y generar sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas (JUnit 5 + JaCoCo)
        run: mvn -B -ntp verify

      - name: Preparar sitio
        run: |
          mkdir -p site/salidas site/codigo
          cp -r web/. site/
          for demo in factorymethod.DemoFactoryMethod builder.DemoBuilder abstractfactory.DemoAbstractFactory prototype.DemoPrototype singleton.DemoSingleton; do
            java -Dstdout.encoding=UTF-8 -cp target/classes "patrones.$demo" > "site/salidas/${demo%%.*}.txt"
          done
          cp -r src/main/java/patrones/. site/codigo/
          cp -r target/site/jacoco site/cobertura
          cp docs/*.docx site/ 2>/dev/null || true
          python3 .github/scripts/resumen_pruebas.py target site/pruebas.json \
            "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
